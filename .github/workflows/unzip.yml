name: Giải nén file ZIP tự động

on:
  push:
    paths:
      - '*.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giải nén file ZIP
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Đang giải nén: $f"
              unzip -o "$f" -d ./extracted/
              rm "$f"
            fi
          done

      - name: Commit và push file đã giải nén
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Tự động giải nén file ZIP" || echo "Không có thay đổi"
          git push
